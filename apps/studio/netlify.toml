[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  # sanity build requires >=20.19.1 <22 or >=22.12. This was pinned to 20.11.1,
  # which fails the engine check outright. Matched to the repo's .nvmrc (20.19.5)
  # and to the pnpm version the rest of the monorepo uses.
  NODE_VERSION = "20.19.5"
  PNPM_VERSION = "9.15.4"
  # Studio uses same Sanity config as web
  SANITY_STUDIO_PRODUCTION_URL = "https://digiprint-main-web.netlify.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for Studio
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
